<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azan Notify</title>
<style>
body { font-family: sans-serif; background: #0a1122; color: #e2b95f; text-align: center; padding: 20px; }
#times { font-size: 1.2em; margin-top: 20px; }
</style>
</head>
<body>
<h1>Azan Notify</h1>
<div id="times">Loading...</div>
<script>
async function fetchTimes() {
  try {
    const res = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Makkah&country=Saudi%20Arabia&method=4');
    const data = await res.json();
    const timings = data.data.timings;
    document.getElementById('times').innerHTML = `
      <p>Fajr: ${timings.Fajr}</p>
      <p>Dhuhr: ${timings.Dhuhr}</p>
      <p>Asr: ${timings.Asr}</p>
      <p>Maghrib: ${timings.Maghrib}</p>
      <p>Isha: ${timings.Isha}</p>
    `;
  } catch (e) {
    document.getElementById('times').textContent = 'Error: ' + e.message;
    if (typeof AndroidBridge !== 'undefined') {
      AndroidBridge.showToast('Error fetching times: ' + e.message);
    }
  }
}
fetchTimes();
</script>
</body>
</html>
