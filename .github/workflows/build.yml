name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: azan-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Generate version.json
        run: |
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | awk '{print $2}' | tr -d '\r')
          echo '{"version_code":'$VERSION_CODE',"download_url":"https://github.com/hipliteidk-glitch/azan-app/releases/download/latest/azan-app-debug.apk"}' > version.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: "Auto-built APK with latest changes."
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify ntfy on success
        if: success()
        run: |
          curl -H "Title: ✅ Azan APK Build Success" -H "Priority: default" -d "New Azan APK ready: https://github.com/hipliteidk-glitch/azan-app/releases/tag/latest" https://ntfy.sh/zeroscript_alerts

      - name: Notify ntfy on failure
        if: failure()
        run: |
          curl -H "Title: ❌ Azan APK Build Failed" -H "Priority: high" -d "Build failed. Check logs: https://github.com/hipliteidk-glitch/azan-app/actions" https://ntfy.sh/zeroscript_alerts
