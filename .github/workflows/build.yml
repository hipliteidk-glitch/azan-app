name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: azan-app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Notify ntfy on success
        if: success()
        run: |
          curl -H "Title: ✅ Azan APK Build Success" -H "Priority: default" -d "The Azan APK is ready. Download from: https://github.com/hipliteidk-glitch/azan-app/actions/runs/${{ github.run_id }}" https://ntfy.sh/zeroscript_alerts
